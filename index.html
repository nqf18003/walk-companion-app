<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>散歩仲間</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="camera">
      <video id="video" class="live" autoplay playsinline muted hidden></video>
      <img id="shot" class="shot" alt="最後に撮った写真" hidden>
      <div id="shotHint" class="shot-hint">「📷 写真」を押すとカメラが開きます。<br>撮った写真がここに出ます。</div>
      <div id="status" class="status">待機中</div>
      <button id="flipBtn" class="flip" type="button">🔄 外カメラ</button>
      <div id="usage" class="usage"></div>
    </div>

    <div id="log" class="log" aria-live="polite"></div>

    <form id="textForm" class="text-form" autocomplete="off">
      <input id="textInput" type="text" enterkeyhint="send" placeholder="文字で話しかける">
      <button type="submit">送信</button>
    </form>

    <div class="controls">
      <button id="photoBtn" class="primary">📷 写真</button>
      <button id="talkBtn">🎤 会話</button>
      <button id="settingsBtn" aria-label="設定">⚙</button>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>設定</h2>
      <label>Claude の API キー
        <!-- type="password" にすると Chrome がパスワードとして Google アカウントに保存しようとするため、
             ふつうの入力欄にして文字を伏せ字で表示する -->
        <input id="apiKey" class="secret" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" data-lpignore="true" placeholder="sk-ant-...">
      </label>
      <p class="note">キーはこのスマホのブラウザの中（localStorage）だけに保存され、Claude に問い合わせるときに Anthropic にだけ送られます。</p>

      <label>モデル
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5（高性能）</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5（中くらい）</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5（安い）</option>
        </select>
      </label>

      <label>写真のモード
        <select id="photoMode">
          <option value="manual">ボタンで撮る（好きなときに撮る・電池にやさしい）</option>
          <option value="auto">自動で撮る（カメラをつけたまま一定の間隔で撮る）</option>
        </select>
      </label>

      <label>自動で撮る間隔（分）
        <input id="interval" type="number" min="0.5" max="60" step="0.5">
      </label>

      <label class="check">
        <input id="photoWithTalk" type="checkbox"> 自動のとき、話しかけたら今の景色も一緒に送る
      </label>

      <label>写真の大きさ（長い辺のピクセル数）
        <select id="imageSize">
          <option value="384">384（とても安い）</option>
          <option value="512">512（ふつう）</option>
          <option value="768">768（くわしい）</option>
        </select>
      </label>

      <label class="check">
        <input id="savePhotos" type="checkbox"> 撮った写真をスマホに保存する
      </label>
      <p class="note">元の大きさの写真が「ダウンロード」フォルダに保存されます。</p>

      <label>読み上げの声
        <select id="voice"></select>
      </label>
      <p class="note">スマホに入っている声から選べます。声を増やすには、Android の設定 →「テキスト読み上げ」で Google の音声データを追加してください。</p>

      <label>声の高さ（左ほど低く男性っぽく、右ほど高く女性っぽく）
        <input id="pitch" type="range" min="0.5" max="1.8" step="0.1">
      </label>

      <label>読み上げの速さ
        <input id="rate" type="range" min="0.7" max="1.5" step="0.1">
      </label>

      <button id="testVoice" type="button" class="small">🔊 声を試す</button>

      <div class="dialog-buttons">
        <button id="clearHistory" type="button">会話をリセット</button>
        <button id="resetUsage" type="button">トークン合計をリセット</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="viewer" class="viewer" hidden>
    <img id="viewerImg" alt="撮った写真">
  </div>

  <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
  <canvas id="canvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
